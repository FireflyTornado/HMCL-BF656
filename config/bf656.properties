# HMCL-BF656 branding. This UTF-8 file is bundled at build time.
# Maintain these values independently of HMCL's config/project.properties.
name=HMCL-BF656
fullName=Battlefield 656 Launcher
version=0.3.14

# BF656 community links and project author, bundled at build time.
project.url=https://github.com/FireflyTornado/HMCL-BF656
# A blank QQ URL copies the group number; blank feedback URLs disable the entry.
# Use the complete invitation URL shared by QQ, rather than deriving one from the number.
contact.qqGroupNumber=1033096961
contact.qqGroupUrl=https://qm.qq.com/q/k4EMK9gWpq
contact.feedbackUrl=https://github.com/FireflyTornado/HMCL-BF656/issues
author.name=FireflyTornado
author.description=GitHub @FireflyTornado
# Optional personal profile link. The avatar is bundled as assets/img/bf656-author.png.
author.url=https://github.com/FireflyTornado

# BF656 self-update settings, bundled at build time.
# Leave update.url blank to disable update checks (no official HMCL fallback).
# Public URLs use HTTPS; HTTP is allowed only on localhost/127.0.0.1/[::1].
update.url=https://bf656.nightbugclub.cn/launcher/update/update.json
# Optional manual download page and full changelog HTML URL.
update.downloadUrl=
update.changelogUrl=
# Independent of the upstream HMCL build type: stable, dev, or nightly.
update.channel=stable
